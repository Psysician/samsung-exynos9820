# BSRE reverse engineering kernel config
# Disable module version CRC checking (no more CRC patching!)
# CONFIG_MODVERSIONS is not set
# Allow force-loading modules with mismatched versions
CONFIG_MODULE_FORCE_LOAD=y
CONFIG_MODULE_FORCE_UNLOAD=y
# Export ALL symbols in kallsyms (hypsniff resolve_ksym needs this)
CONFIG_KALLSYMS_ALL=y
# Userspace probes (alternative to kernel probes)
CONFIG_UPROBES=y
# Userfaultfd (page-fault-based userspace interception)
CONFIG_USERFAULTFD=y
# Seccomp BPF (Snowblind technique)
CONFIG_SECCOMP=y
CONFIG_SECCOMP_FILTER=y
# Kretprobes
CONFIG_KRETPROBES=y
# Disable strict module RWX (allow JIT/trampoline in modules)
# CONFIG_STRICT_MODULE_RWX is not set
# Process VM readv/writev (fast cross-process memory)
CONFIG_CROSS_MEMORY_ATTACH=y
